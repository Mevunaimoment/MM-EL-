<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mevunai Moment™ — MM'EL Radio & Flagship Music Player</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3a0714" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="mmel-icon.png" />
  <style>
    :root {
      --bg-grad: radial-gradient(circle at 50% 10%, #5c0a1e 0%, #2a040d 65%, #160207 100%);
      --card-bg: rgba(32, 4, 12, 0.85);
      --gold: #e5c158;
      --gold-bright: #ffe28a;
      --gold-dim: rgba(229, 193, 88, 0.35);
      --text-main: #fdf6e3;
      --text-muted: #d4b97c;
      --accent-glow: rgba(229, 193, 88, 0.28);
    }
    body.emerald {
      --bg-grad: radial-gradient(circle at 50% 10%, #0b4632 0%, #042419 65%, #02120c 100%);
      --card-bg: rgba(4, 30, 21, 0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 16px 96px;
      background-attachment: fixed;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--gold-dim); border-radius: 16px;
      padding: 12px 14px; background: var(--card-bg); margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .brand-title { font-size: 16px; font-weight: bold; color: var(--gold-bright); letter-spacing: 1px; }
    .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
    .theme-btn {
      background: linear-gradient(135deg, #f3d478, #c5982c);
      color: #26050d; border: none; border-radius: 20px;
      padding: 7px 13px; font-size: 11px; font-weight: bold; cursor: pointer;
      letter-spacing: 0.6px; text-transform: uppercase;
    }
    .player-card {
      border: 1.5px solid var(--gold); border-radius: 22px;
      background: var(--card-bg); padding: 20px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55), inset 0 0 24px var(--accent-glow);
      text-align: center; margin-bottom: 16px;
    }
    .crest-badge {
      font-size: 10px; letter-spacing: 2px; color: var(--gold);
      text-transform: uppercase; margin-bottom: 12px;
    }
    .turntable-wrap {
      position: relative; width: 176px; height: 176px; margin: 0 auto 14px;
      border-radius: 50%; padding: 6px;
      background: linear-gradient(135deg, var(--gold-bright), #8c6414);
      box-shadow: 0 0 28px var(--accent-glow);
    }
    .vinyl {
      width: 100%; height: 100%; border-radius: 50%;
      background: repeating-radial-gradient(#111 0, #111 3px, #241c11 4px, #111 5px);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .vinyl.spinning { animation: spin 7s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .vinyl-label {
      width: 78px; height: 78px; border-radius: 50%;
      border: 2px solid var(--gold-bright);
      background: #3a0714; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .vinyl-label img { width: 100%; height: 100%; object-fit: cover; }
    .vinyl-fallback { font-size: 11px; font-weight: bold; color: var(--gold-bright); letter-spacing: 1px; }
    .track-title { font-size: 19px; color: var(--gold-bright); font-weight: bold; margin-bottom: 4px; }
    .track-artist { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .eq-bars {
      display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 22px; margin-bottom: 14px;
    }
    .eq-bar {
      width: 4px; height: 5px; background: var(--gold-bright); border-radius: 2px;
      transition: height 0.15s ease;
    }
    .eq-bars.active .eq-bar { animation: bounce 0.6s ease-in-out infinite alternate; }
    .eq-bars.active .eq-bar:nth-child(2) { animation-delay: 0.15s; }
    .eq-bars.active .eq-bar:nth-child(3) { animation-delay: 0.3s; }
    .eq-bars.active .eq-bar:nth-child(4) { animation-delay: 0.1s; }
    .eq-bars.active .eq-bar:nth-child(5) { animation-delay: 0.25s; }
    .eq-bars.active .eq-bar:nth-child(6) { animation-delay: 0.4s; }
    @keyframes bounce { from { height: 4px; } to { height: 22px; } }
    .progress-wrap { margin-bottom: 14px; }
    .progress-bar {
      width: 100%; accent-color: var(--gold-bright); cursor: pointer; height: 5px;
    }
    .time-row {
      display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 4px;
    }
    .controls {
      display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px;
    }
    .ctrl-btn {
      background: rgba(229, 193, 88, 0.14); border: 1px solid var(--gold);
      color: var(--gold-bright); width: 44px; height: 44px; border-radius: 50%;
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .play-btn {
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, #ffe28a, #c79828);
      color: #26050d; border: none; font-size: 22px; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 18px var(--accent-glow);
    }
    .vol-row {
      display: flex; align-items: center; gap: 10px; justify-content: center;
      font-size: 12px; color: var(--text-muted);
    }
    .vol-row input { width: 140px; accent-color: var(--gold-bright); }
    .status-pill {
      display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 12px;
      background: rgba(229, 193, 88, 0.12); border: 1px solid var(--gold-dim);
      font-size: 11px; color: var(--gold-bright);
    }
    .section-card {
      border: 1px solid var(--gold-dim); border-radius: 18px;
      background: var(--card-bg); padding: 15px; margin-bottom: 14px;
    }
    .section-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .section-title { font-size: 14px; color: var(--gold-bright); font-weight: bold; letter-spacing: 0.8px; text-transform: uppercase; }
    .upload-btn {
      background: linear-gradient(135deg, #f3d478, #c5982c);
      color: #26050d; border: none; border-radius: 14px;
      padding: 6px 12px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .track-list { display: flex; flex-direction: column; gap: 8px; }
    .track-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--gold-dim); background: rgba(0,0,0,0.22);
      cursor: pointer; text-align: left; color: var(--text-main);
    }
    .track-item.active {
      border-color: var(--gold-bright); background: rgba(229, 193, 88, 0.16);
    }
    .t-name { font-size: 13px; font-weight: bold; color: var(--gold-bright); }
    .t-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .t-tag {
      font-size: 10px; padding: 3px 8px; border-radius: 10px;
      border: 1px solid var(--gold); color: var(--gold-bright);
    }
    .url-row { display: flex; gap: 8px; margin-top: 10px; }
    .url-input {
      flex: 1; background: rgba(0,0,0,0.35); border: 1px solid var(--gold-dim);
      border-radius: 10px; padding: 9px 11px; color: var(--text-main); font-size: 12px;
    }
    .footer-stamp {
      text-align: center; font-size: 11px; color: var(--gold);
      letter-spacing: 1px; margin-top: 16px; opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="brand-title">MEVUNAI MOMENT™</div>
        <div class="brand-sub">MM'EL MUSIC &amp; SOUND LOUNGE · M'M™</div>
      </div>
      <button class="theme-btn" id="themeBtn">EMERALD SILK</button>
    </div>

    <div class="player-card">
      <div class="crest-badge">▲ EYE OF HORUS · RA 109 SOUND ENGINE ▲</div>
      <div class="turntable-wrap">
        <div class="vinyl" id="vinylDisc">
          <div class="vinyl-label">
            <img src="mmel-icon.png" alt="MM'EL" onerror="this.style.display='none'; document.getElementById('vFallback').style.display='block';" />
            <span class="vinyl-fallback" id="vFallback" style="display:none;">M'M™</span>
          </div>
        </div>
      </div>

      <div class="track-title" id="nowTitle">Crimson Silk Atrium Lounge</div>
      <div class="track-artist" id="nowArtist">MM'EL Resident DJ · 24/7 Sovereign Stream</div>

      <div class="eq-bars" id="eqBars">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>

      <div class="progress-wrap">
        <input type="range" id="seekBar" class="progress-bar" min="0" max="100" value="0" />
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">LIVE</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" title="Previous">⏮</button>
        <button class="play-btn" id="playBtn" title="Play / Pause">▶</button>
        <button class="ctrl-btn" id="nextBtn" title="Next">⏭</button>
      </div>

      <div class="vol-row">
        <span>🔈</span>
        <input type="range" id="volBar" min="0" max="1" step="0.02" value="0.85" />
        <span>🔊</span>
      </div>

      <div class="status-pill" id="statusPill">Ready · Tap Play or Upload Local MP3/WAV</div>
    </div>

    <div class="section-card">
      <div class="section-head">
        <div class="section-title">Sovereign Stations &amp; Playlist</div>
        <label class="upload-btn">
          + Add Audio Files
          <input type="file" id="audioUpload" accept="audio/*" multiple style="display:none;" />
        </label>
      </div>
      <div class="track-list" id="trackList"></div>

      <div class="url-row">
        <input type="text" id="customUrl" class="url-input" placeholder="Paste direct .mp3 / .aac / radio stream URL..." />
        <button class="upload-btn" id="addUrlBtn">Play URL</button>
      </div>
    </div>

    <div class="footer-stamp">mevunai Moment™ Country Club, Inc ®</div>
  </div>

  <audio id="audioEl" crossorigin="anonymous" preload="none"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }

    var tracks = [
      {
        title: "Crimson Silk Atrium Lounge",
        artist: "MM'EL Deep Lounge · SomaFM Groove Salad",
        url: "https://ice1.somafm.com/groovesalad-128-mp3",
        tag: "LIVE STREAM",
        live: true
      },
      {
        title: "Private Jet Midnight Flight",
        artist: "MM'EL Chillout · SomaFM Drone Zone",
        url: "https://ice1.somafm.com/dronezone-128-mp3",
        tag: "LIVE STREAM",
        live: true
      },
      {
        title: "Superbike & Night Drive",
        artist: "MM'EL Synth & Bass · SomaFM Def Con",
        url: "https://ice1.somafm.com/defcon-128-mp3",
        tag: "LIVE STREAM",
        live: true
      },
      {
        title: "Pharaoh's Velvet Gala",
        artist: "MM'EL Jazzy Beats · SomaFM Secret Agent",
        url: "https://ice1.somafm.com/secretagent-128-mp3",
        tag: "LIVE STREAM",
        live: true
      },
      {
        title: "RA 109 Golden Pyramid Ambient (Offline)",
        artist: "Built-In Sovereign Synth Engine",
        url: "SYNTH",
        tag: "OFFLINE SYNTH",
        live: true
      }
    ];

    var currentIndex = 0;
    var isPlaying = false;
    var audioEl = document.getElementById('audioEl');
    var playBtn = document.getElementById('playBtn');
    var vinylDisc = document.getElementById('vinylDisc');
    var eqBars = document.getElementById('eqBars');
    var statusPill = document.getElementById('statusPill');
    var seekBar = document.getElementById('seekBar');
    var curTime = document.getElementById('curTime');
    var durTime = document.getElementById('durTime');

    var audioCtx = null;
    var synthOsc1 = null;
    var synthOsc2 = null;
    var synthGain = null;

    function stopSynth() {
      if (synthOsc1) { try { synthOsc1.stop(); } catch(e){} synthOsc1 = null; }
      if (synthOsc2) { try { synthOsc2.stop(); } catch(e){} synthOsc2 = null; }
    }

    function startSynth() {
      stopSynth();
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      synthGain = audioCtx.createGain();
      synthGain.gain.value = parseFloat(document.getElementById('volBar').value) * 0.14;
      synthGain.connect(audioCtx.destination);

      synthOsc1 = audioCtx.createOscillator();
      synthOsc2 = audioCtx.createOscillator();
      synthOsc1.type = 'sine';
      synthOsc2.type = 'triangle';
      synthOsc1.frequency.value = 174;
      synthOsc2.frequency.value = 261.63;
      synthOsc1.connect(synthGain);
      synthOsc2.connect(synthGain);
      synthOsc1.start();
      synthOsc2.start();
    }

    function fmtTime(sec) {
      if (!sec || isNaN(sec) || !isFinite(sec)) return "LIVE";
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function setPlayingUI(active) {
      isPlaying = active;
      playBtn.textContent = active ? "❚❚" : "▶";
      if (active) {
        vinylDisc.classList.add('spinning');
        eqBars.classList.add('active');
      } else {
        vinylDisc.classList.remove('spinning');
        eqBars.classList.remove('active');
      }
    }

    function renderList() {
      var list = document.getElementById('trackList');
      list.innerHTML = "";
      tracks.forEach(function(t, idx) {
        var btn = document.createElement('button');
        btn.className = 'track-item' + (idx === currentIndex ? ' active' : '');
        btn.innerHTML = '<div><div class="t-name">' + t.title + '</div><div class="t-meta">' + t.artist + '</div></div><span class="t-tag">' + t.tag + '</span>';
        btn.onclick = function() { loadTrack(idx, true); };
        list.appendChild(btn);
      });
    }

    function loadTrack(idx, autoPlay) {
      currentIndex = idx;
      var t = tracks[idx];
      document.getElementById('nowTitle').textContent = t.title;
      document.getElementById('nowArtist').textContent = t.artist;
      renderList();

      audioEl.pause();
      stopSynth();
      seekBar.value = 0;
      curTime.textContent = "0:00";
      durTime.textContent = t.live ? "LIVE" : "0:00";

      if (t.url === "SYNTH") {
        if (autoPlay) {
          startSynth();
          setPlayingUI(true);
          statusPill.textContent = "Playing · RA 109 Offline Ambient Synth";
        } else {
          setPlayingUI(false);
        }
        return;
      }

      audioEl.src = t.url;
      if (autoPlay) {
        statusPill.textContent = "Connecting to stream...";
        audioEl.play().then(function() {
          setPlayingUI(true);
          statusPill.textContent = "Now Playing · " + t.title;
        }).catch(function() {
          statusPill.textContent = "Stream blocked by network — switching to Offline Synth";
          startSynth();
          setPlayingUI(true);
        });
      } else {
        setPlayingUI(false);
      }
    }

    playBtn.onclick = function() {
      var t = tracks[currentIndex];
      if (isPlaying) {
        audioEl.pause();
        stopSynth();
        setPlayingUI(false);
        statusPill.textContent = "Paused";
      } else {
        if (t.url === "SYNTH") {
          startSynth();
          setPlayingUI(true);
          statusPill.textContent = "Playing · RA 109 Offline Ambient Synth";
        } else {
          if (!audioEl.src) audioEl.src = t.url;
          statusPill.textContent = "Starting playback...";
          audioEl.play().then(function() {
            setPlayingUI(true);
            statusPill.textContent = "Now Playing · " + t.title;
          }).catch(function() {
            startSynth();
            setPlayingUI(true);
            statusPill.textContent = "Playing · Offline Ambient Synth Fallback";
          });
        }
      }
    };

    document.getElementById('prevBtn').onclick = function() {
      var next = (currentIndex - 1 + tracks.length) % tracks.length;
      loadTrack(next, true);
    };

    document.getElementById('nextBtn').onclick = function() {
      var next = (currentIndex + 1) % tracks.length;
      loadTrack(next, true);
    };

    document.getElementById('volBar').oninput = function(e) {
      var v = parseFloat(e.target.value);
      audioEl.volume = v;
      if (synthGain) synthGain.gain.value = v * 0.14;
    };

    audioEl.ontimeupdate = function() {
      if (audioEl.duration && isFinite(audioEl.duration)) {
        seekBar.value = (audioEl.currentTime / audioEl.duration) * 100;
        curTime.textContent = fmtTime(audioEl.currentTime);
        durTime.textContent = fmtTime(audioEl.duration);
      } else {
        curTime.textContent = fmtTime(audioEl.currentTime);
        durTime.textContent = "LIVE";
      }
    };

    audioEl.onended = function() {
      var next = (currentIndex + 1) % tracks.length;
      loadTrack(next, true);
    };

    seekBar.oninput = function(e) {
      if (audioEl.duration && isFinite(audioEl.duration)) {
        audioEl.currentTime = (parseFloat(e.target.value) / 100) * audioEl.duration;
      }
    };

    document.getElementById('audioUpload').onchange = function(e) {
      var files = Array.from(e.target.files || []);
      if (!files.length) return;
      var firstAdded = tracks.length;
      files.forEach(function(file) {
        var objUrl = URL.createObjectURL(file);
        tracks.push({
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Local Device Audio · Sovereign Vault",
          url: objUrl,
          tag: "LOCAL FILE",
          live: false
        });
      });
      loadTrack(firstAdded, true);
    };

    document.getElementById('addUrlBtn').onclick = function() {
      var u = document.getElementById('customUrl').value.trim();
      if (!u) return;
      tracks.push({
        title: "Custom Sovereign Stream #" + (tracks.length + 1),
        artist: u.slice(0, 42),
        url: u,
        tag: "CUSTOM URL",
        live: true
      });
      document.getElementById('customUrl').value = "";
      loadTrack(tracks.length - 1, true);
    };

    document.getElementById('themeBtn').onclick = function() {
      document.body.classList.toggle('emerald');
      this.textContent = document.body.classList.contains('emerald') ? "CRIMSON SILK" : "EMERALD SILK";
    };

    renderList();
  </script>
</body>
</html>
