<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24K Gold Pyramid & Crimson Silk Screensaver</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#140206" />
  <link rel="icon" type="image/png" href="./icon-512.png" />
  <style>
    :root {
      --crimson-deep: #140206;
      --crimson-mid: #3a0612;
      --crimson-glow: #680b20;
      --gold-light: #fff0a8;
      --gold-24k: #e5b83b;
      --gold-deep: #9c7214;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, var(--crimson-mid) 0%, var(--crimson-deep) 78%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--gold-light);
    }

    body.idle-cursor {
      cursor: none;
    }

    /* Crimson Silk Shimmer Waves */
    .silk-backdrop {
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(ellipse at 30% 35%, rgba(128, 12, 38, 0.42), transparent 55%),
        radial-gradient(ellipse at 72% 65%, rgba(92, 8, 28, 0.48), transparent 60%),
        repeating-linear-gradient(
          115deg,
          rgba(255, 215, 110, 0.025) 0px,
          rgba(255, 215, 110, 0.025) 2px,
          transparent 2px,
          transparent 28px
        );
      animation: silkDrift 18s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes silkDrift {
      0% { transform: scale(1) translate(-1.5%, -1%) rotate(-1deg); }
      100% { transform: scale(1.07) translate(1.5%, 1.5%) rotate(1deg); }
    }

    /* Gold Particle Canvas */
    #particleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Custom MP4 Layer */
    #customVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 3;
      display: none;
      background: #0d0104;
    }

    /* Center 24K Pyramid Stage */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 4;
      pointer-events: none;
      padding: 2rem;
    }

    .crest-wrapper {
      position: relative;
      width: min(56vmin, 420px);
      height: min(56vmin, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: crestFloat 20s ease-in-out infinite;
    }

    @keyframes crestFloat {
      0%, 100% { transform: translateY(0px) scale(0.98); filter: drop-shadow(0 0 28px rgba(229, 184, 59, 0.28)); }
      50% { transform: translateY(-10px) scale(1.03); filter: drop-shadow(0 0 52px rgba(255, 224, 118, 0.52)); }
    }

    .halo-ring {
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      border: 1.5px solid rgba(229, 184, 59, 0.35);
      box-shadow: inset 0 0 35px rgba(229, 184, 59, 0.16), 0 0 35px rgba(229, 184, 59, 0.16);
      animation: ringPulse 10s ease-in-out infinite alternate;
    }

    .halo-ring-inner {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 240, 168, 0.25);
      animation: ringSpin 60s linear infinite;
    }

    @keyframes ringPulse {
      0% { transform: scale(0.97); opacity: 0.65; }
      100% { transform: scale(1.03); opacity: 1; }
    }

    @keyframes ringSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    svg.pyramid-svg {
      width: 78%;
      height: 78%;
      overflow: visible;
    }

    .capstone-group {
      animation: capstoneLevitate 20s ease-in-out infinite;
      transform-origin: 200px 110px;
    }

    @keyframes capstoneLevitate {
      0%, 100% { transform: translateY(0px); }
      25% { transform: translateY(-8px); }
      50% { transform: translateY(-3px); }
      75% { transform: translateY(-10px); }
    }

    .eye-pupil {
      animation: eyePulse 6s ease-in-out infinite alternate;
      transform-origin: 200px 104px;
    }

    @keyframes eyePulse {
      0% { transform: scale(0.92); opacity: 0.85; }
      100% { transform: scale(1.12); opacity: 1; }
    }

    .shimmer-sweep {
      animation: goldSweep 8s ease-in-out infinite;
    }

    @keyframes goldSweep {
      0% { opacity: 0.15; }
      50% { opacity: 0.65; }
      100% { opacity: 0.15; }
    }

    /* Optional Title & Corner Clock */
    .title-block {
      margin-top: 1.4rem;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    .title-block h1 {
      font-size: clamp(1.1rem, 2.5vw, 1.75rem);
      letter-spacing: 0.42em;
      font-weight: 600;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff6c9 0%, #e5b83b 55%, #a87b16 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 18px rgba(229, 184, 59, 0.25);
    }

    .title-block p {
      margin-top: 0.45rem;
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(255, 240, 168, 0.68);
    }

    .corner-clock {
      position: fixed;
      top: 1.5rem;
      right: 1.8rem;
      z-index: 6;
      text-align: right;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .corner-clock .time {
      font-size: 1.45rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: rgba(255, 240, 168, 0.82);
    }

    .corner-clock .date {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(229, 184, 59, 0.62);
      margin-top: 0.15rem;
    }

    body.pure-artwork .title-block,
    body.pure-artwork .corner-clock {
      opacity: 0 !important;
    }

    /* Auto-Hiding Control Bar */
    .hud-bar {
      position: fixed;
      bottom: 1.6rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      background: rgba(20, 2, 6, 0.84);
      border: 1px solid rgba(229, 184, 59, 0.38);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .hud-bar.hidden {
      opacity: 0;
      transform: translate(-50%, 14px);
      pointer-events: none;
    }

    .hud-btn {
      background: linear-gradient(180deg, rgba(229, 184, 59, 0.18), rgba(156, 114, 20, 0.12));
      border: 1px solid rgba(229, 184, 59, 0.45);
      color: var(--gold-light);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: rgba(229, 184, 59, 0.32);
      border-color: var(--gold-light);
      box-shadow: 0 0 14px rgba(229, 184, 59, 0.35);
    }

    .hud-btn.active {
      background: linear-gradient(180deg, #f3cd63, #c49222);
      color: #1a0308;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="silk-backdrop"></div>
  <canvas id="particleCanvas"></canvas>
  <video id="customVideo" loop muted playsinline></video>

  <div class="corner-clock" id="cornerClock">
    <div class="time" id="clockTime">12:00</div>
    <div class="date" id="clockDate">SOVEREIGN MODE</div>
  </div>

  <main class="stage" id="pyramidStage">
    <div class="crest-wrapper">
      <div class="halo-ring"></div>
      <div class="halo-ring-inner"></div>
      <svg class="pyramid-svg" viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff3b8" />
            <stop offset="45%" stop-color="#e5b83b" />
            <stop offset="100%" stop-color="#a87914" />
          </linearGradient>
          <linearGradient id="goldRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d4a22a" />
            <stop offset="60%" stop-color="#8c620d" />
            <stop offset="100%" stop-color="#593c05" />
          </linearGradient>
          <linearGradient id="capstoneGrad" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="35%" stop-color="#ffe885" />
            <stop offset="100%" stop-color="#d6a127" />
          </linearGradient>
          <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff8cc" stop-opacity="0.95" />
            <stop offset="65%" stop-color="#e5b83b" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#e5b83b" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Base Pyramid Body -->
        <polygon points="142,145 45,320 200,320 200,145" fill="url(#goldLeft)" stroke="#ffe885" stroke-width="1.2" />
        <polygon points="200,145 200,320 355,320 258,145" fill="url(#goldRight)" stroke="#d4a22a" stroke-width="1.2" />

        <!-- Subtle Horizontal Masonry Etchings -->
        <line x1="118" y1="188" x2="282" y2="188" stroke="rgba(255,244,184,0.28)" stroke-width="1" />
        <line x1="94" y1="232" x2="306" y2="232" stroke="rgba(255,244,184,0.24)" stroke-width="1" />
        <line x1="70" y1="276" x2="330" y2="276" stroke="rgba(255,244,184,0.2)" stroke-width="1" />

        <!-- Levitating Capstone & Eye of Horus -->
        <g class="capstone-group">
          <circle cx="200" cy="102" r="46" fill="url(#eyeGlow)" class="shimmer-sweep" />
          <polygon points="200,34 147,132 253,132" fill="url(#capstoneGrad)" stroke="#fff7c2" stroke-width="1.6" />
          <!-- Eye Outline -->
          <path d="M 168 104 Q 200 82 232 104 Q 200 124 168 104 Z" fill="#180207" stroke="#fff0a8" stroke-width="2" />
          <!-- Eye Iris -->
          <circle class="eye-pupil" cx="200" cy="104" r="10.5" fill="#ffd23f" />
          <circle cx="200" cy="104" r="4.2" fill="#180207" />
          <!-- Eye of Horus Brow & Spiral Accent -->
          <path d="M 164 93 Q 200 72 236 93" fill="none" stroke="#180207" stroke-width="2.4" stroke-linecap="round" />
          <path d="M 200 116 L 200 124 Q 192 128 188 122" fill="none" stroke="#180207" stroke-width="2" stroke-linecap="round" />
        </g>
      </svg>
    </div>

    <div class="title-block" id="titleBlock">
      <h1>24K SOVEREIGN</h1>
      <p>Crimson Silk &bull; Eternal Loop</p>
    </div>
  </main>

  <nav class="hud-bar" id="hudBar" aria-label="Screensaver Controls">
    <button class="hud-btn" id="btnFullscreen">Full Screen (F11)</button>
    <button class="hud-btn" id="btnPureArt">Pure Artwork: Off</button>
    <button class="hud-btn" id="btnLoadMp4">Load Custom .MP4</button>
    <button class="hud-btn" id="btnMute" style="display:none;">Unmute Video</button>
    <button class="hud-btn" id="btnResetMp4" style="display:none;">Reset Default</button>
    <input type="file" id="mp4Input" accept="video/mp4,video/*" hidden />
  </nav>

  <script>
    // 1. Register Service Worker for Offline Caching
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // 2. Gold Dust Particle System
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles() {
      const count = Math.min(110, Math.floor((window.innerWidth * window.innerHeight) / 14000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.2 + 0.6,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -(Math.random() * 0.45 + 0.15),
        alpha: Math.random() * 0.75 + 0.2,
        phase: Math.random() * Math.PI * 2
      }));
    }
    createParticles();

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.phase += 0.03;

        if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;

        const twinkle = p.alpha * (0.65 + 0.35 * Math.sin(p.phase));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 224, 122, ${twinkle.toFixed(3)})`;
        ctx.fill();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 3. Auto-Hide HUD & Cursor After 3 Seconds of Inactivity
    const hudBar = document.getElementById('hudBar');
    let idleTimer = null;

    function showHudTemporarily() {
      hudBar.classList.remove('hidden');
      document.body.classList.remove('idle-cursor');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        hudBar.classList.add('hidden');
        document.body.classList.add('idle-cursor');
      }, 3000);
    }

    ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, showHudTemporarily, { passive: true });
    });
    showHudTemporarily();

    // 4. Fullscreen Toggle
    const btnFullscreen = document.getElementById('btnFullscreen');
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen (F11)';
    });

    // 5. Pure Artwork Mode Toggle (Hides Title & Corner Clock)
    const btnPureArt = document.getElementById('btnPureArt');
    let pureArtwork = localStorage.getItem('pureArtworkMode') === 'true';

    function applyPureArtworkState() {
      document.body.classList.toggle('pure-artwork', pureArtwork);
      btnPureArt.textContent = pureArtwork ? 'Pure Artwork: On' : 'Pure Artwork: Off';
      btnPureArt.classList.toggle('active', pureArtwork);
    }
    applyPureArtworkState();

    btnPureArt.addEventListener('click', () => {
      pureArtwork = !pureArtwork;
      localStorage.setItem('pureArtworkMode', pureArtwork);
      applyPureArtworkState();
    });

    // 6. Subtle Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clockTime').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('clockDate').textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 10000);

    // 7. Offline Custom .MP4 Storage via IndexedDB
    const DB_NAME = 'GoldPyramidScreensaverDB';
    const STORE_NAME = 'customIntro';
    const customVideo = document.getElementById('customVideo');
    const pyramidStage = document.getElementById('pyramidStage');
    const btnLoadMp4 = document.getElementById('btnLoadMp4');
    const btnMute = document.getElementById('btnMute');
    const btnResetMp4 = document.getElementById('btnResetMp4');
    const mp4Input = document.getElementById('mp4Input');

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveVideoBlob(blob) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(blob, 'activeMp4');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadVideoBlob() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get('activeMp4');
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function clearVideoBlob() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete('activeMp4');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function activateVideoMode(blob) {
      const url = URL.createObjectURL(blob);
      customVideo.src = url;
      customVideo.style.display = 'block';
      pyramidStage.style.display = 'none';
      btnMute.style.display = 'inline-block';
      btnResetMp4.style.display = 'inline-block';
      customVideo.play().catch(() => {});
    }

    function activateDefaultPyramidMode() {
      customVideo.pause();
      customVideo.removeAttribute('src');
      customVideo.style.display = 'none';
      pyramidStage.style.display = 'flex';
      btnMute.style.display = 'none';
      btnResetMp4.style.display = 'none';
    }

    btnLoadMp4.addEventListener('click', () => mp4Input.click());

    mp4Input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await saveVideoBlob(file);
      activateVideoMode(file);
      mp4Input.value = '';
    });

    btnMute.addEventListener('click', () => {
      customVideo.muted = !customVideo.muted;
      btnMute.textContent = customVideo.muted ? 'Unmute Video' : 'Mute Video';
    });

    btnResetMp4.addEventListener('click', async () => {
      await clearVideoBlob();
      activateDefaultPyramidMode();
    });

    // Boot stored MP4 if available
    loadVideoBlob().then(blob => {
      if (blob) activateVideoMode(blob);
    }).catch(() => {});
  </script>
</body>
</html>
